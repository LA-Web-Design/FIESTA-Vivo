<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Foto Fiesta en Vivo!</title>
    <style>
        /* Fondo basado en el tono oscuro de tu textura */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a0f24;
            /* Si querés usar tu imagen de textura real más adelante, 
               subila al repositorio y descomentá esta línea:
               background-image: url('nombre-de-tu-imagen.jpg'); 
               background-size: cover; */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Tarjeta principal estilo Glassmorphism con el tono púrpura correcto */
        .card {
            background: linear-gradient(135deg, rgba(38, 22, 53, 0.92), rgba(20, 11, 30, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border-radius: 28px;
            padding: 35px 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
            box-sizing: border-box;
        }

        .card h2 {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #d8c8e8;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        /* Botones principales: Cian neón con iconos bien alineados */
        .btn-accion {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #00e5ff, #00acc1);
            color: #120b18;
            border: none;
            border-radius: 50px;
            padding: 15px 20px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.5);
            text-decoration: none;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-accion:active {
            transform: scale(0.98);
        }

        /* Contenedor fijo para el icono a la izquierda */
        .btn-accion .icono {
            font-size: 1.2rem;
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Texto perfectamente centrado en el espacio restante */
        .btn-accion .texto {
            flex: 1;
            text-align: center;
            padding-right: 30px; /* Compensación para que quede simétrico con el icono */
        }

        /* Caja de texto con efecto "calado" (hundido) */
        .textarea-box {
            background-color: rgba(12, 6, 18, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 5px 12px rgba(0, 0, 0, 0.7), 
                        0 1px 0 rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 15px;
            text-align: left;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #e0d4ed;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
            min-height: 70px;
        }

        textarea::placeholder {
            color: rgba(220, 210, 235, 0.35);
        }

        .contador-caracteres {
            text-align: right;
            font-size: 0.75rem;
            color: rgba(220, 210, 235, 0.4);
            margin-top: 5px;
        }

        /* Mensaje de éxito */
        .mensaje-exito {
            font-size: 0.88rem;
            color: #d0d0d0;
            margin: 2px 0;
        }

        .mensaje-exito span.verde {
            color: #2af598;
            font-weight: bold;
        }

        /* Botón inferior "SUBIR MÁS" en verde brillante */
        .btn-subir-mas {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #2af598, #00b09b);
            color: #120b18;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(42, 245, 152, 0.4);
            margin: 0 auto;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .btn-subir-mas:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SUBIR CONTENIDO</h2>

        <!-- Botón Galería -->
        <button class="btn-accion">
            <span class="icono">🖼️</span>
            <span class="texto">SELECCIONAR DE GALERÍA</span>
        </button>

        <!-- Botón Cámara -->
        <button class="btn-accion">
            <span class="icono">📸</span>
            <span class="texto">TOMAR FOTO O VIDEO</span>
        </button>

        <!-- Cuadro de texto (Efecto calado) -->
        <div class="textarea-box">
            <textarea placeholder="Escribe tu saludo (máx. 200 caracteres)" maxlength="200"></textarea>
            <div class="contador-caracteres">0/200</div>
        </div>

        <!-- Botón Enviar -->
        <button class="btn-accion">
            <span class="icono">📤</span>
            <span class="texto">ENVIAR</span>
        </button>

        <!-- Mensaje de éxito -->
        <div class="mensaje-exito">
            ¡ÉXITO! Se subieron <span class="verde">3</span> imágenes y <span class="verde">1</span> texto.
        </div>

        <!-- Botón Subir Más -->
        <button class="btn-subir-mas">
            <span>+</span> SUBIR MÁS
        </button>
    </div>

</body>
</html>
