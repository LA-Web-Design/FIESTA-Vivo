<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Contenido - Foto Fiesta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #160d21;
            background-image: url('tapiz.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-top: 1px solid rgba(255, 255, 255, 0.35);
            border-bottom: 2px solid rgba(0, 0, 0, 0.7);
            border-left: 1px solid rgba(255, 255, 255, 0.15);
            border-right: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(70, 30, 110, 0.4);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-upload {
            display: block;
            width: 100%;
            height: 44px;
            margin-bottom: 8px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, opacity 0.2s;
        }

        #labelGaleria { background-image: url('btn-galeria.png'); }
        #labelFoto { background-image: url('btn-tomar-foto.png'); }
        #labelVideo { background-image: url('btn-grabar-video.png'); }
        
        #labelEnviar { 
            background-image: url('btn-enviar.png'); 
            margin-top: 15px;
            cursor: pointer;
        }

        .btn-upload:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        input[type="file"] {
            display: none;
        }

        .counter {
            font-size: 0.75rem;
            color: #00e5ff;
            margin-bottom: 6px;
            display: block;
            min-height: 12px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 75px;
            background: linear-gradient(135deg, #1c0c2e 0%, #10041a 100%) !important;
            border: 1px solid rgba(180, 100, 255, 0.3);
            border-radius: 14px;
            padding: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            box-shadow: inset 0 5px 12px rgba(0, 0, 0, 0.95), 0 1px 2px rgba(255, 255, 255, 0.05);
            margin-bottom: 4px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .char-counter {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
            display: block;
            margin-bottom: 5px;
            padding-right: 5px;
        }

        #mensajeExito {
            display: none;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #2ecc71;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
        }

        .btn-mas-contenido {
            display: none;
            width: 65%;
            margin: 15px auto 0 auto;
            height: 40px;
            background-color: #2ecc71;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn-mas-contenido:active {
            transform: scale(0.97);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="card" id="cardContainer">
        <h2>Subir Contenido</h2>

        <label class="btn-upload" id="labelGaleria">
            <input type="file" id="fileGaleria" multiple accept="image/*,video/*">
        </label>
        <span id="counterGaleria" class="counter"></span>

        <label class="btn-upload" id="labelFoto">
            <input type="file" id="fileFoto" accept="image/*" capture="environment">
        </label>
        <span id="counterFoto" class="counter"></span>

        <label class="btn-upload" id="labelVideo">
            <input type="file" id="fileVideo" accept="video/*" capture="environment">
        </label>
        <span id="counterVideo" class="counter"></span>

        <textarea id="textoMensaje" maxlength="200" placeholder="Escribe un mensaje..."></textarea>
        <span id="charCount" class="char-counter">0/200 (opcional)</span>

        <div class="btn-upload" id="labelEnviar" onclick="enviarContenido()"></div>
        
        <div id="mensajeExito"></div>
        <button id="btnMasContenido" class="btn-mas-contenido" onclick="location.reload()">SUBIR MÁS</button>
    </div>

    <script>
        // ¡No olvides actualizar esta URL con la de tu implementación web actual de Foto Fiesta!
        const URL_APPS_SCRIPT = "AQUI_PEGA_TU_URL_DE_IMPLEMENTACION";

        let archivosAcumulados = [];

        document.getElementById('fileGaleria').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterGaleria').textContent = count > 0 ? `${count} archivo(s) seleccionado(s) ✓` : '';
            agregarACola(this.files);
        });

        document.getElementById('fileFoto').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterFoto').textContent = count > 0 ? `1 foto capturada ✓` : '';
            agregarACola(this.files);
        });

        document.getElementById('fileVideo').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterVideo').textContent = count > 0 ? `1 video grabado ✓` : '';
            agregarACola(this.files);
        });

        function agregarACola(files) {
            for (let file of files) {
                archivosAcumulados.push(file);
            }
        }

        const textarea = document.getElementById('textoMensaje');
        const charCount = document.getElementById('charCount');
        textarea.addEventListener('input', function() {
            const len = this.value.length;
            charCount.textContent = `${len}/200 (opcional)`;
        });

        function comprimirImagen(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_WIDTH = 1000;
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.80);
                        resolve(dataUrl);
                    };
                };
            });
        }

        function leerArchivoBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function enviarContenido() {
            const texto = textarea.value.trim();

            if (archivosAcumulados.length === 0 && !texto) {
                alert("Por favor selecciona al menos un archivo o escribe un mensaje.");
                return;
            }

            const btnSubmit = document.getElementById('labelEnviar');
            btnSubmit.style.opacity = "0.6";
            btnSubmit.style.pointerEvents = "none";

            const divExito = document.getElementById('mensajeExito');
            divExito.style.display = 'block';

            let correctas = 0;
            let videoContador = 0;
            let textoEnviado = false;

            try {
                // 1. Enviar archivos uno por uno de forma segura
                for (let i = 0; i < archivosAcumulados.length; i++) {
                    const file = archivosAcumulados[i];
                    divExito.style.color = "#00e5ff";
                    divExito.innerHTML = `Subiendo archivo ${i + 1} de ${archivosAcumulados.length}...`;

                    let payload = {};
                    if (file.type.startsWith('image/')) {
                        let base64Comprimido = await comprimirImagen(file);
                        payload = { tipo: 'foto', file: base64Comprimido, name: file.name, mimeType: 'image/jpeg' };
                        correctas++;
                    } else if (file.type.startsWith('video/')) {
                        let base64 = await leerArchivoBase64(file);
                        payload = { tipo: 'video', file: base64, name: file.name, mimeType: file.type };
                        videoContador++;
                    }

                    await fetch(URL_APPS_SCRIPT, {
                        method: 'POST',
                        body: JSON.stringify(payload)
                    });
                }

                // 2. Enviar texto si existe
                if (texto) {
                    divExito.innerHTML = `Enviando mensaje de texto...`;
                    await fetch(URL_APPS_SCRIPT, {
                        method: 'POST',
                        body: JSON.stringify({ tipo: 'texto', contenido: texto })
                    });
                    textoEnviado = true;
                }

                // 3. Pantalla de éxito final
                btnSubmit.style.display = 'none';

                let mensajeExitoHTML = `¡Éxito, envío completado!<br>`;
                if (correctas > 0) mensajeExitoHTML += `• ${correctas} foto(s)<br>`;
                if (videoContador > 0) mensajeExitoHTML += `• ${videoContador} video(s)<br>`;
                if (textoEnviado) mensajeExitoHTML += `• 1 mensaje de texto`;

                divExito.style.color = "#2ecc71";
                divExito.innerHTML = mensajeExitoHTML;

                document.getElementById('btnMasContenido').style.display = 'block';

            } catch (error) {
                alert("Hubo un error al enviar. Revisa tu conexión.");
                btnSubmit.style.opacity = "1";
                btnSubmit.style.pointerEvents = "auto";
                divExito.style.display = 'none';
            }
        }
    </script>
</body>
</html>
