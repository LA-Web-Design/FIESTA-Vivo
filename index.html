<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Foto Fiesta en Vivo!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a0f24;
            background-image: url('fondo.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .card {
            background: linear-gradient(135deg, rgba(85, 55, 115, 0.9), rgba(55, 34, 78, 0.93));
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6),
                        inset 0 15px 35px rgba(255, 255, 255, 0.1),
                        inset 0 -15px 35px rgba(0, 0, 0, 0.2);
            border-radius: 32px;
            padding: 35px 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
            box-sizing: border-box;
        }

        .card h2 {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #f0e0ff;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        .btn-accion {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #4deeea 0%, #00bcd4 100%);
            color: #120b18;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 50px;
            padding: 15px 20px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 188, 212, 0.2);
            text-decoration: none;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .btn-accion:active {
            transform: scale(0.98);
        }

        .btn-accion .icono {
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-accion .icono svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #120b18;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-accion .texto {
            flex: 1;
            text-align: center;
            padding-right: 30px;
        }

        .textarea-box {
            background: linear-gradient(145deg, #100718, #180c22);
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: inset 6px 6px 14px rgba(0, 0, 0, 0.8),
                        inset -2px -2px 6px rgba(50, 25, 75, 0.3),
                        0 1px 0 rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 16px;
            text-align: left;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #e0d4ed;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
            min-height: 70px;
        }

        textarea::placeholder {
            color: rgba(220, 210, 235, 0.35);
        }

        .contador-caracteres {
            text-align: right;
            font-size: 0.75rem;
            color: rgba(220, 210, 235, 0.4);
            margin-top: 5px;
            font-style: italic;
        }

        .mensaje-exito {
            font-size: 0.88rem;
            color: #d0d0d0;
            margin: 2px 0;
        }

        .btn-subir-mas {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #76ff03 0%, #00e676 100%);
            color: #120b18;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 230, 118, 0.2);
            margin: 0 auto;
            text-decoration: none;
            transition: transform 0.15s ease;
        }

        .btn-subir-mas:active {
            transform: scale(0.98);
        }

        .input-oculto {
            display: none;
        }

        #loadingOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 15, 36, 0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 15px;
            font-size: 1rem;
            color: #4deeea;
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div>Enviando contenido... por favor espera ⏳</div>
    </div>

    <div class="card" id="mainCard">
        <h2>SUBIR CONTENIDO</h2>

        <!-- AQUI ESTÁ EL MULTIPLE RESTAURADO -->
        <input type="file" id="fileGaleria" class="input-oculto" accept="image/*,video/*" multiple>
        <input type="file" id="fileCamara" class="input-oculto" accept="image/*" capture="environment">

        <button type="button" class="btn-accion" id="btnGaleria">
            <span class="icono">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </span>
            <span class="texto">SELECCIONAR DE GALERÍA</span>
        </button>

        <button type="button" class="btn-accion" id="btnCamara">
            <span class="icono">
                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </span>
            <span class="texto">TOMAR FOTO O VIDEO</span>
        </button>

        <div class="textarea-box" id="textBoxContainer">
            <textarea id="saludoText" placeholder="Escribe tu saludo" maxlength="200"></textarea>
            <div class="contador-caracteres" id="contador">0/200 (opcional)</div>
        </div>

        <button type="button" class="btn-accion" id="btnEnviar">
            <span class="icono">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </span>
            <span class="texto">ENVIAR</span>
        </button>
    </div>

    <div class="card" id="successCard" style="display: none;">
        <h2>¡LISTO!</h2>
        <div class="mensaje-exito">
            ¡ÉXITO! Se subió tu contenido correctamente. 🎉
        </div>
        <button type="button" class="btn-subir-mas" id="btnSubirMas">
            <span>+</span> SUBIR MÁS
        </button>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwR3jniWrcz6p8k06LBfT4TxDMsLkhlbpnX8dws0dEB2rElX3pJW12T9Y6xFFIY9wYo/exec";

        const btnGaleria = document.getElementById('btnGaleria');
        const fileGaleria = document.getElementById('fileGaleria');
        const btnCamara = document.getElementById('btnCamara');
        const fileCamara = document.getElementById('fileCamara');
        const saludoText = document.getElementById('saludoText');
        const contador = document.getElementById('contador');
        const btnEnviar = document.getElementById('btnEnviar');
        
        const mainCard = document.getElementById('mainCard');
        const successCard = document.getElementById('successCard');
        const btnSubirMas = document.getElementById('btnSubirMas');
        const loadingOverlay = document.getElementById('loadingOverlay');

        let archivosSeleccionados = [];

        btnGaleria.addEventListener('click', () => fileGaleria.click());
        fileGaleria.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                archivosSeleccionados = Array.from(e.target.files);
                btnGaleria.style.background = 'linear-gradient(135deg, #2af598 0%, #009efd 100%)';
                btnGaleria.querySelector('.texto').textContent = `${archivosSeleccionados.length} ARCHIVO(S) SELECCIONADO(S) ✓`;
            }
        });

        btnCamara.addEventListener('click', () => fileCamara.click());
        fileCamara.addEventListener('change', (e) => {
            if(e.target.files.length > 0) {
                archivosSeleccionados = Array.from(e.target.files);
                btnCamara.style.background = 'linear-gradient(135deg, #2af598 0%, #009efd 100%)';
                btnCamara.querySelector('.texto').textContent = "FOTO TOMADA ✓";
            }
        });

        saludoText.addEventListener('input', () => {
            contador.textContent = `${saludoText.value.length}/200 (opcional)`;
        });

        function leerArchivoComoBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        btnEnviar.addEventListener('click', async () => {
            const texto = saludoText.value.trim();
            const nombreInvitado = "Invitado";

            if (archivosSeleccionados.length === 0 && texto === "") {
                alert("Por favor, selecciona al menos una foto/video o escribe un saludo.");
                return;
            }

            loadingOverlay.style.display = 'flex';

            try {
                // Enviar cada archivo seleccionado uno por uno
                for (let archivo of archivosSeleccionados) {
                    const base64Data = await leerArchivoComoBase64(archivo);
                    const tipoArchivo = archivo.type.startsWith('video') ? 'video' : 'foto';

                    const payload = {
                        tipo: tipoArchivo,
                        usuario: nombreInvitado,
                        contenido: base64Data,
                        nombreArchivo: archivo.name
                    };

                    await fetch(URL_APPS_SCRIPT, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                // Enviar texto si hay
                if (texto !== "") {
                    const payloadTexto = {
                        tipo: "texto",
                        usuario: nombreInvitado,
                        contenido: texto
                    };

                    await fetch(URL_APPS_SCRIPT, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payloadTexto)
                    });
                }

                loadingOverlay.style.display = 'none';
                mainCard.style.display = 'none';
                successCard.style.display = 'flex';

            } catch (error) {
                loadingOverlay.style.display = 'none';
                alert("Hubo un error al enviar. Revisa tu conexión.");
                console.error(error);
            }
        });

        btnSubirMas.addEventListener('click', () => {
            saludoText.value = '';
            contador.textContent = '0/200 (opcional)';
            archivosSeleccionados = [];
            fileGaleria.value = '';
            fileCamara.value = '';
            btnGaleria.style.background = 'linear-gradient(135deg, #4deeea 0%, #00bcd4 100%)';
            btnGaleria.querySelector('.texto').textContent = "SELECCIONAR DE GALERÍA";
            btnCamara.style.background = 'linear-gradient(135deg, #4deeea 0%, #00bcd4 100%)';
            btnCamara.querySelector('.texto').textContent = "TOMAR FOTO O VIDEO";
            
            successCard.style.display = 'none';
            mainCard.style.display = 'flex';
        });
    </script>
</body>
</html>
