<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Foto Fiesta en Vivo!</title>
    <style>
        /* Fondo con textura granulada original */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1025;
            background-image: 
                radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 0),
                radial-gradient(rgba(0, 0, 0, 0.3) 1px, transparent 0);
            background-size: 4px 4px, 8px 8px;
            background-position: 0 0, 2px 2px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        /* Tarjeta principal estilo Neumorfismo / Glassmorphism */
        .card {
            background: linear-gradient(135deg, rgba(40, 25, 55, 0.95), rgba(25, 15, 35, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 24px;
            padding: 30px 20px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card h2 {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #e0d4ed;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        /* Estilo base para los botones principales con icono a la izquierda y texto centrado */
        .btn-accion {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 16px 20px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 180, 219, 0.4);
            text-decoration: none;
            box-sizing: border-box;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-accion:active {
            transform: scale(0.98);
        }

        /* Icono fijo a la izquierda */
        .btn-accion .icono {
            position: absolute;
            left: 22px;
            font-size: 1.2rem;
        }

        /* Texto centrado en el botón */
        .btn-accion .texto {
            margin: 0 auto;
        }

        /* Caja de texto para saludos */
        .textarea-box {
            background-color: rgba(15, 8, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            text-align: left;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #e0d4ed;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
            min-height: 70px;
        }

        textarea::placeholder {
            color: rgba(220, 210, 235, 0.5);
        }

        .contador-caracteres {
            text-align: right;
            font-size: 0.75rem;
            color: rgba(220, 210, 235, 0.5);
            margin-top: 5px;
        }

        /* Mensaje de éxito */
        .mensaje-exito {
            font-size: 0.85rem;
            color: #ccc;
            margin: 5px 0;
        }

        .mensaje-exito span.verde {
            color: #2af598;
            font-weight: bold;
        }

        /* Botón verde inferior "SUBIR MÁS" */
        .btn-subir-mas {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #2af598, #00b09b);
            color: #120b18;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(42, 245, 152, 0.3);
            margin: 0 auto;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .btn-subir-mas:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SUBIR CONTENIDO</h2>

        <!-- Botón Galería -->
        <button class="btn-accion">
            <span class="icono">🖼️</span>
            <span class="texto">SELECCIONAR DE GALERÍA</span>
        </button>

        <!-- Botón Cámara -->
        <button class="btn-accion">
            <span class="icono">📸</span>
            <span class="texto">TOMAR FOTO O VIDEO</span>
        </button>

        <!-- Cuadro de texto -->
        <div class="textarea-box">
            <textarea placeholder="Escribe tu saludo (máx. 200 caracteres)" maxlength="200"></textarea>
            <div class="contador-caracteres">0/200</div>
        </div>

        <!-- Botón Enviar -->
        <button class="btn-accion">
            <span class="icono">📤</span>
            <span class="texto">ENVIAR</span>
        </button>

        <!-- Estado -->
        <div class="mensaje-exito">
            ¡ÉXITO! Se subieron <span class="verde">3</span> imágenes y <span class="verde">1</span> texto.
        </div>

        <!-- Botón Subir Más (Verde) -->
        <button class="btn-subir-mas">
            <span>+</span> SUBIR MÁS
        </button>
    </div>

</body>
</html>
