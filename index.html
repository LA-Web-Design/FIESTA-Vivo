<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Aplicación Web</title>
    <style>
        /* Estilos generales del cuerpo de la página */
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* Contenedor principal de la app */
        .main-container {
            width: 90%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        /* Estilos del Footer con textura oscura y texto cian */
        .app-footer {
            margin-top: 30px;
            padding: 15px 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.78rem;
            line-height: 1.5;
            letter-spacing: 0.3px;
            
            /* Fondo oscuro con textura simulada estilo OSB/antracita */
            background-color: #111111;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.25'/%3E%3C/svg%3E");
            
            /* Borde sutil y sombra para integrar con el diseño */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .app-footer p {
            margin: 4px 0;
            color: #00d4ff; /* Azul cian brillante idéntico a tu sitio */
            font-weight: 500;
        }

        .app-footer a {
            color: #00d4ff;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .app-footer a:hover {
            opacity: 0.8;
            text-shadow: 0 0 8px rgba(0, 212, 255, 0.7);
        }
    </style>
</head>
<body>

    <!-- CONTENIDO PRINCIPAL DE TU APP -->
    <main class="main-container">
        <!-- Acá va el contenido, botones o funciones de tu app -->
    </main>

    <!-- FOOTER CON TU FIRMA Y CRÉDITOS -->
    <footer class="app-footer">
        <p><a href="http://www.luisalbertocaceres.com.ar" target="_blank" rel="noopener noreferrer">Diseño de Luis Alberto Cáceres © 2026</a></p>
        <p>Código de Gemini</p>
        <p>Prohibida su reproducción total y/o parcial</p>
    </footer>

</body>
</html>
