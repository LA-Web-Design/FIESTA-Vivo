<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Foto Fiesta en Vivo!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo base oscuro púrpura */
            background-color: #1a0f24;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        /* Panel principal con el tono púrpura claro y elegante que pediste */
        .card {
            background: linear-gradient(135deg, rgba(48, 28, 68, 0.94), rgba(28, 16, 42, 0.96));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            border-radius: 28px;
            padding: 35px 24px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 22px;
            box-sizing: border-box;
        }

        .card h2 {
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            color: #e2d4ed;
            margin: 0 0 5px 0;
            font-weight: 600;
        }

        /* Botones principales tipo Cian Neón */
        .btn-accion {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #00e5ff, #00acc1);
            color: #120b18;
            border: none;
            border-radius: 50px;
            padding: 15px 20px;
            width: 100%;
            font-size: 0.9rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 229, 255, 0.5);
            text-decoration: none;
            box-sizing: border-box;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-accion:active {
            transform: scale(0.98);
        }

        /* Contenedor del icono minimalista en línea blanca pura */
        .btn-accion .icono {
            width: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn-accion .icono svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: #120b18; /* Líneas oscuras para buen contraste sobre el cian */
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .btn-accion .texto {
            flex: 1;
            text-align: center;
            padding-right: 30px;
        }

        /* Caja de texto con efecto de hendidura (calado) real: sombra oscura interna y luz abajo */
        .textarea-box {
            background-color: rgba(14, 7, 21, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.8), 
                        0 1px 0 rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 15px;
            text-align: left;
            box-sizing: border-box;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #e0d4ed;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            font-family: inherit;
            box-sizing: border-box;
            min-height: 70px;
        }

        textarea::placeholder {
            color: rgba(220, 210, 235, 0.35);
        }

        .contador-caracteres {
            text-align: right;
            font-size: 0.75rem;
            color: rgba(220, 210, 235, 0.4);
            margin-top: 5px;
        }

        .mensaje-exito {
            font-size: 0.88rem;
            color: #d0d0d0;
            margin: 2px 0;
        }

        .mensaje-exito span.verde {
            color: #2af598;
            font-weight: bold;
        }

        /* Botón inferior verde */
        .btn-subir-mas {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #2af598, #00b09b);
            color: #120b18;
            border: none;
            border-radius: 30px;
            padding: 10px 24px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(42, 245, 152, 0.4);
            margin: 0 auto;
            text-decoration: none;
            transition: transform 0.2s ease;
        }

        .btn-subir-mas:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>SUBIR CONTENIDO</h2>

        <!-- Botón Galería con icono minimalista SVG -->
        <button class="btn-accion">
            <span class="icono">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            </span>
            <span class="texto">SELECCIONAR DE GALERÍA</span>
        </button>

        <!-- Botón Cámara con icono minimalista SVG -->
        <button class="btn-accion">
            <span class="icono">
                <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            </span>
            <span class="texto">TOMAR FOTO O VIDEO</span>
        </button>

        <!-- Cuadro de texto con efecto hendidura -->
        <div class="textarea-box">
            <textarea placeholder="Escribe tu saludo (máx. 200 caracteres)" maxlength="200"></textarea>
            <div class="contador-caracteres">0/200</div>
        </div>

        <!-- Botón Enviar con icono minimalista SVG -->
        <button class="btn-accion">
            <span class="icono">
                <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </span>
            <span class="texto">ENVIAR</span>
        </button>

        <div class="mensaje-exito">
            ¡ÉXITO! Se subieron <span class="verde">3</span> imágenes y <span class="verde">1</span> texto.
        </div>

        <button class="btn-subir-mas">
            <span>+</span> SUBIR MÁS
        </button>
    </div>

</body>
</html>
