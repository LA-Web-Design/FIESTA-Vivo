<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Contenido</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* Textura y fondo original de tu diseño */
            background-color: #1a1025;
            background-image: radial-gradient(circle at 50% 50%, rgba(50, 25, 75, 0.6) 0%, rgba(15, 8, 25, 0.95) 100%), 
                              repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0, rgba(255,255,255,0.01) 2px, transparent 0, transparent 4px);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background: rgba(30, 15, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-upload {
            display: block;
            width: 100%;
            padding: 11px 15px; /* Altura optimizada y más estilizada */
            margin-bottom: 4px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b1a2d;
            font-weight: bold;
            font-size: 0.85rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.25);
            transition: transform 0.1s;
        }

        .btn-upload:active {
            transform: scale(0.98);
        }

        input[type="file"] {
            display: none;
        }

        .counter {
            font-size: 0.75rem;
            color: #2ecc71;
            margin-bottom: 12px;
            display: block;
            min-height: 14px;
            font-weight: 500;
        }

        /* Caja de texto con el efecto de hendidura original */
        textarea {
            width: 100%;
            height: 75px;
            background: #100618;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.6); /* Efecto hendidura recuperado */
            margin-bottom: 4px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .char-counter {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
            display: block;
            margin-bottom: 15px;
            padding-right: 5px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0b1a2d;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Subir Contenido</h2>

        <!-- 1. Galería -->
        <label class="btn-upload">
            📂 SELECCIONAR DE GALERÍA
            <input type="file" id="fileGaleria" multiple accept="image/*,video/*">
        </label>
        <span id="counterGaleria" class="counter"></span>

        <!-- 2. Tomar Foto -->
        <label class="btn-upload">
            📷 TOMAR FOTO
            <input type="file" id="fileFoto" accept="image/*" capture="environment">
        </label>
        <span id="counterFoto" class="counter"></span>

        <!-- 3. Grabar Video -->
        <label class="btn-upload">
            📹 GRABAR VIDEO
            <input type="file" id="fileVideo" accept="video/*" capture="environment">
        </label>
        <span id="counterVideo" class="counter"></span>

        <!-- 4. Caja de Texto con hendidura -->
        <textarea id="textoMensaje" maxlength="200" placeholder="Hola"></textarea>
        <span id="charCount" class="char-counter">4/200 (opcional)</span>

        <!-- Botón Enviar -->
        <button class="btn-submit" onclick="enviarContenido()">ENVIAR</button>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwR3jniWrcz6p8k06LBfT4TxDMsLkhlbpnX8dws0dEB2rElX3pJW12T9Y6xFFIY9wYo/exec";

        document.getElementById('fileGaleria').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterGaleria').textContent = count > 0 ? `${count} archivo(s) seleccionado(s) ✓` : '';
        });

        document.getElementById('fileFoto').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterFoto').textContent = count > 0 ? `${count} foto(s) capturada(s) ✓` : '';
        });

        document.getElementById('fileVideo').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterVideo').textContent = count > 0 ? `${count} video(s) grabado(s) ✓` : '';
        });

        const textarea = document.getElementById('textoMensaje');
        const charCount = document.getElementById('charCount');
        textarea.addEventListener('input', function() {
            const len = this.value.length;
            charCount.textContent = `${len}/200 (opcional)`;
        });

        async function enviarContenido() {
            alert("¡Interfaz restaurada con el diseño original y botones independientes listos!");
        }
    </script>
</body>
</html>
