<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Contenido - Fiesta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #1a1025;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background: rgba(35, 20, 50, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-upload {
            display: block;
            width: 100%;
            padding: 10px 15px; /* Altura reducida para que no sean gigantes */
            margin-bottom: 6px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0d1b2a;
            font-weight: bold;
            font-size: 0.9rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-upload:active {
            opacity: 0.8;
        }

        input[type="file"] {
            display: none;
        }

        .counter {
            font-size: 0.75rem;
            color: #2ecc71;
            margin-bottom: 15px;
            display: block;
            min-height: 15px;
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #12091c;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 10px;
            color: #ffffff;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            margin-bottom: 5px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .char-counter {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
            display: block;
            margin-bottom: 15px;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0d1b2a;
            font-weight: bold;
            font-size: 0.95rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Subir Contenido</h2>

        <!-- 1. Galería -->
        <label class="btn-upload">
            📂 SELECCIONAR DE GALERÍA
            <input type="file" id="fileGaleria" multiple accept="image/*,video/*">
        </label>
        <span id="counterGaleria" class="counter"></span>

        <!-- 2. Tomar Foto -->
        <label class="btn-upload">
            📷 TOMAR FOTO
            <input type="file" id="fileFoto" accept="image/*" capture="environment">
        </label>
        <span id="counterFoto" class="counter"></span>

        <!-- 3. Grabar Video -->
        <label class="btn-upload">
            📹 GRABAR VIDEO
            <input type="file" id="fileVideo" accept="video/*" capture="environment">
        </label>
        <span id="counterVideo" class="counter"></span>

        <!-- 4. Caja de Texto -->
        <textarea id="textoMensaje" maxlength="200" placeholder="Escribe un mensaje (opcional)..."></textarea>
        <span id="charCount" class="char-counter">0/200 (opcional)</span>

        <!-- Botón Enviar -->
        <button class="btn-submit" onclick="enviarContenido()">ENVIAR</button>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwR3jniWrcz6p8k06LBfT4TxDMsLkhlbpnX8dws0dEB2rElX3pJW12T9Y6xFFIY9wYo/exec";

        // Contadores visuales
        document.getElementById('fileGaleria').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterGaleria').textContent = count > 0 ? `${count} archivo(s) seleccionado(s) ✓` : '';
        });

        document.getElementById('fileFoto').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterFoto').textContent = count > 0 ? `${count} foto(s) capturada(s) ✓` : '';
        });

        document.getElementById('fileVideo').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterVideo').textContent = count > 0 ? `${count} video(s) grabado(s) ✓` : '';
        });

        // Contador de caracteres del textarea
        const textarea = document.getElementById('textoMensaje');
        const charCount = document.getElementById('charCount');
        textarea.addEventListener('input', function() {
            const len = this.value.length;
            charCount.textContent = `${len}/200 (opcional)`;
        });

        async function enviarContenido() {
            const galeriaFiles = document.getElementById('fileGaleria').files;
            const fotoFile = document.getElementById('fileFoto').files[0];
            const videoFile = document.getElementById('fileVideo').files[0];
            const texto = textarea.value.trim();

            if (galeriaFiles.length === 0 && !fotoFile && !videoFile && !texto) {
                alert("Por favor selecciona al menos un archivo o escribe un mensaje.");
                return;
            }

            // Aquí puedes procesar el envío secuencialmente a tu URL_APPS_SCRIPT
            alert("¡Estructura lista para enviar!");
        }
    </script>
</body>
</html>
