<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir Contenido - Fiesta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #160d21;
            background-image: url('tapiz.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .card {
            background-image: url('fondo.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid rgba(255, 255, 255, 0.15);
            width: 100%;
            max-width: 380px;
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(70, 30, 110, 0.4);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        h2 {
            color: #ffffff;
            font-size: 1.1rem;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-upload {
            display: block;
            width: 100%;
            height: 44px;
            margin-bottom: 8px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.1s, opacity 0.2s;
        }

        #labelGaleria { background-image: url('btn-galeria.png'); }
        #labelFoto { background-image: url('btn-tomar-foto.png'); }
        #labelVideo { background-image: url('btn-grabar-video.png'); }
        
        #labelEnviar { 
            background-image: url('btn-enviar.png'); 
            margin-top: 15px;
        }

        .btn-upload:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        input[type="file"] {
            display: none;
        }

        .counter {
            font-size: 0.7rem;
            color: #00e5ff;
            margin-bottom: 6px;
            display: block;
            min-height: 12px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 75px;
            background: #11071c; /* Tono liso más oscuro para generar profundidad y hendidura */
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            color: #ffffff;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.85), 0 1px 2px rgba(255, 255, 255, 0.08);
            margin-bottom: 4px;
        }

        textarea::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        .char-counter {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: right;
            display: block;
            margin-bottom: 5px;
            padding-right: 5px;
        }

        #mensajeExito {
            display: none;
            margin-top: 15px;
            font-size: 0.9rem;
            color: #2ecc71;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Subir Contenido</h2>

        <label class="btn-upload" id="labelGaleria">
            <input type="file" id="fileGaleria" multiple accept="image/*,video/*">
        </label>
        <span id="counterGaleria" class="counter"></span>

        <label class="btn-upload" id="labelFoto">
            <input type="file" id="fileFoto" accept="image/*" capture="environment">
        </label>
        <span id="counterFoto" class="counter"></span>

        <label class="btn-upload" id="labelVideo">
            <input type="file" id="fileVideo" accept="video/*" capture="environment">
        </label>
        <span id="counterVideo" class="counter"></span>

        <textarea id="textoMensaje" maxlength="200" placeholder="Escribe un mensaje..."></textarea>
        <span id="charCount" class="char-counter">0/200 (opcional)</span>

        <div class="btn-upload" id="labelEnviar" onclick="enviarContenido()"></div>
        
        <div id="mensajeExito"></div>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbwR3jniWrcz6p8k06LBfT4TxDMsLkhlbpnX8dws0dEB2rElX3pJW12T9Y6xFFIY9wYo/exec";

        document.getElementById('fileGaleria').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterGaleria').textContent = count > 0 ? `${count} archivo(s) seleccionado(s) ✓` : '';
        });

        document.getElementById('fileFoto').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterFoto').textContent = count > 0 ? `1 foto capturada ✓` : '';
        });

        document.getElementById('fileVideo').addEventListener('change', function() {
            const count = this.files.length;
            document.getElementById('counterVideo').textContent = count > 0 ? `1 video grabado ✓` : '';
        });

        const textarea = document.getElementById('textoMensaje');
        const charCount = document.getElementById('charCount');
        textarea.addEventListener('input', function() {
            const len = this.value.length;
            charCount.textContent = `${len}/200 (opcional)`;
        });

        function comprimirImagen(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_WIDTH = 1200;
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        resolve(dataUrl);
                    };
                };
            });
        }

        function leerArchivoBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        async function enviarContenido() {
            const galeriaFiles = document.getElementById('fileGaleria').files;
            const fotoFile = document.getElementById('fileFoto').files[0];
            const videoFile = document.getElementById('fileVideo').files[0];
            const texto = textarea.value.trim();

            if (galeriaFiles.length === 0 && !fotoFile && !videoFile && !texto) {
                alert("Por favor selecciona al menos un archivo o escribe un mensaje.");
                return;
            }

            const btnSubmit = document.getElementById('labelEnviar');
            btnSubmit.style.opacity = "0.6";
            btnSubmit.style.pointerEvents = "none";

            try {
                let itemsParaEnviar = [];
                let contadorFotos = 0;
                let contadorVideos = 0;
                let contadorTexto = 0;

                for (let file of galeriaFiles) {
                    if (file.type.startsWith('image/')) {
                        let base64Comprimido = await comprimirImagen(file);
                        itemsParaEnviar.push({ tipo: 'foto', file: base64Comprimido, name: file.name, mimeType: 'image/jpeg' });
                        contadorFotos++;
                    } else if (file.type.startsWith('video/')) {
                        let base64 = await leerArchivoBase64(file);
                        itemsParaEnviar.push({ tipo: 'video', file: base64, name: file.name, mimeType: file.type });
                        contadorVideos++;
                    }
                }

                if (fotoFile) {
                    let base64Comprimido = await comprimirImagen(fotoFile);
                    itemsParaEnviar.push({ tipo: 'foto', file: base64Comprimido, name: fotoFile.name, mimeType: 'image/jpeg' });
                    contadorFotos++;
                }

                if (videoFile) {
                    let base64 = await leerArchivoBase64(videoFile);
                    itemsParaEnviar.push({ tipo: 'video', file: base64, name: videoFile.name, mimeType: videoFile.type });
                    contadorVideos++;
                }

                if (texto) {
                    itemsParaEnviar.push({ tipo: 'texto', contenido: texto });
                    contadorTexto = 1;
                }

                // Enviamos los elementos secuencialmente para asegurar que lleguen bien
                for (let item of itemsParaEnviar) {
                    await fetch(URL_APPS_SCRIPT, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(item)
                    });
                }

                btnSubmit.style.display = 'none';

                // Armamos el mensaje detallado de éxito con las cantidades exactas
                let mensajeExitoHTML = `¡Éxito, envío completado!<br>`;
                if (contadorFotos > 0) mensajeExitoHTML += `• ${contadorFotos} foto(s)<br>`;
                if (contadorVideos > 0) mensajeExitoHTML += `• ${contadorVideos} video(s)<br>`;
                if (contadorTexto > 0) mensajeExitoHTML += `• 1 mensaje de texto`;

                const divExito = document.getElementById('mensajeExito');
                divExito.innerHTML = mensajeExitoHTML;
                divExito.style.display = 'block';

            } catch (error) {
                alert("Hubo un error al enviar. Revisa tu conexión.");
                btnSubmit.style.opacity = "1";
                btnSubmit.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
